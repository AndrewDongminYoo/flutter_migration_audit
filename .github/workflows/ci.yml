name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      # The corpus is rebuilt from pinned commits and release tags, so the
      # committed manifests must come out unchanged.
      - name: Build corpus
        run: |
          uv run --python 3.12 scripts/fetch_snapshots.py
          uv run --python 3.12 scripts/fetch_api_docs.py
          git diff --exit-code -- data/manifest

      # The index file name is a hash of the model and the embedded sections,
      # so it changes exactly when the index must be rebuilt.
      - name: Locate embedding index
        id: index
        run: |
          name=$(uv run python -c 'from fma.corpus import load_chunks; from fma.dense import cache_path; from fma.retrieval import cli_chunks; print(cache_path(cli_chunks(load_chunks())).name)')
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "FASTEMBED_CACHE_PATH=$HOME/.cache/fastembed" >> "$GITHUB_ENV"

      # A partial hit restores the model, so only the index is rebuilt.
      - name: Restore embedding index
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            data/index
            ~/.cache/fastembed
          key: embedding-${{ steps.index.outputs.name }}
          restore-keys: embedding-

      - name: Build embedding index
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          INDEX_NAME: ${{ steps.index.outputs.name }}
        run: |
          uv run fma index
          find data/index -name '*.npy' ! -name "$INDEX_NAME" -delete

      # Saved before the tests, so a failing test does not discard the build.
      - name: Save embedding index
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            data/index
            ~/.cache/fastembed
          key: embedding-${{ steps.index.outputs.name }}

      - name: Test
        env:
          FMA_REQUIRE_EMBEDDING_INDEX: "1"
        run: uv run pytest -rs
