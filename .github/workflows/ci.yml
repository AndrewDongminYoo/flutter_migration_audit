name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # A build with no cache at all embeds every snapshot part; the parts are
    # cached separately, so later runs rebuild only a new snapshot.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      # The corpus is rebuilt from pinned commits and release tags, so the
      # committed manifests must come out unchanged.
      - name: Build corpus
        run: |
          uv run --python 3.12 scripts/fetch_snapshots.py
          uv run --python 3.12 scripts/fetch_api_docs.py
          git diff --exit-code -- data/manifest

      # The CLI index is one file per snapshot, named by a hash of the model
      # and the embedded sections. The cache key combines the file names, so
      # it changes exactly when some part must be rebuilt.
      - name: Locate embedding index
        id: index
        run: |
          uv run python -c 'from fma.retrieval import cli_index_files; print("\n".join(cli_index_files()))' > "$RUNNER_TEMP/index-files"
          cat "$RUNNER_TEMP/index-files"
          echo "key=$(sha256sum "$RUNNER_TEMP/index-files" | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "FASTEMBED_CACHE_PATH=$HOME/.cache/fastembed" >> "$GITHUB_ENV"

      # A partial hit restores the model and the parts that did not change,
      # so only the changed parts are rebuilt.
      - name: Restore embedding index
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            data/index
            ~/.cache/fastembed
          key: embedding-${{ steps.index.outputs.key }}
          restore-keys: embedding-

      - name: Build embedding index
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          uv run fma index
          find data/index -name '*.npy' | while read -r f; do
            grep -qxF "$(basename "$f")" "$RUNNER_TEMP/index-files" || rm "$f"
          done

      # Saved before the tests, so a failing test does not discard the build.
      - name: Save embedding index
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            data/index
            ~/.cache/fastembed
          key: embedding-${{ steps.index.outputs.key }}

      - name: Test
        env:
          FMA_REQUIRE_EMBEDDING_INDEX: "1"
        run: uv run pytest -rs
